name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: PYTHONPATH=src python3 -m agentsec_bench.generate --out /tmp/tasks
      - run: PYTHONPATH=src python3 -m agentsec_bench.cli run --agent all --tasks /tmp/tasks --out /tmp/results
