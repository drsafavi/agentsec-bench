[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsec-bench"
version = "0.1.0"
description = "An open benchmark for indirect prompt injection in tool-augmented LLM agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Seyedmostafa Safavi", email = "seyed.safavi@apu.edu.my" }]
keywords = ["indirect prompt injection", "llm agents", "tool-augmented agents",
            "security benchmark", "agent evaluation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.39"]
dev = ["pytest>=7", "jsonschema>=4"]

[project.urls]
Homepage = "https://github.com/drsafavi/agentsec-bench"

[project.scripts]
agentsec-bench = "agentsec_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
